// Companion mod (separately distributed jar): forks the minimal mezz.jei.api
// surface (MIT, from the JEI source), loads third-party JEI plugins itself when
// the real JEI is absent, collects their recipe catalysts, and injects them into
// the BRBE main mod's workstation registry. Single jar, dual loader.
base {
    archivesName = "${rootProject.archives_base_name}-jei-plugins-${rootProject.minecraft_version}"
}

dependencies {
    // RecipeViewerIndex.WorkstationSpec — provided by the BRBE main mod at runtime
    compileOnly project(":common")
    // Real JEI API only as a compile-time source for signature references not
    // copied into the fork (javac prefers our forked sources; the remaining
    // references are resolved lazily at runtime and never packaged here)
    def jeiJar = rootProject.file("libs/jei-26.2-fabric-30.4.0.25.jar")
    if (jeiJar.exists()) { compileOnly files(jeiJar) }
    // NeoForge entry (@Mod annotation; NeoForge/LevelEvent come from the
    // universal jar) — provided at runtime by NeoForge 26.2.0.1-beta.  The
    // neoforge POM marks these as provided, so they must be declared explicitly.
    compileOnly "net.neoforged:neoforge:${rootProject.neoforge_version}"
    compileOnly "net.neoforged.fancymodloader:loader:11.0.13"
    // Fabric client world lifecycle events (ClientWorldEvents) — provided at
    // runtime by Fabric API.
    compileOnly "net.fabricmc.fabric-api:fabric-lifecycle-events-v1:4.1.3+4575b05f9e"
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}
