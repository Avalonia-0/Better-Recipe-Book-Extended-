plugins {
    id "net.fabricmc.fabric-loom" version "1.17.18"
}

// ============================================================
//  Version sanity check — prevent cross-branch contamination
// ============================================================
// Each git branch targets a specific Minecraft version. If
// gradle.properties was accidentally carried over from another
// branch (e.g. 1.21.11 → 26.1.2), fail fast with a clear message.
//
// Expected mapping (branch → minecraft_version):
//   1.21.1   → 1.21.1
//   1.21.11  → 1.21.11
//   26.1.2   → 26.1.2
//   26.2     → 26.2
// ============================================================
def currentBranch = providers.exec(execSpec -> {
    execSpec.commandLine("git", "rev-parse", "--abbrev-ref", "HEAD")
}).standardOutput.asText.get().trim()

def expectedVersion = currentBranch
// Strip "origin/" prefix if on a remote-tracking branch
if (expectedVersion.startsWith("origin/")) expectedVersion = expectedVersion.substring(7)

// If the branch name looks like a version (contains a dot or is a single major), validate
if (expectedVersion.matches(/\d+\.\d+(\.\d+)?/) && expectedVersion != minecraft_version) {
    throw new GradleException(
        "Minecraft version mismatch!\n" +
        "  Branch:            ${currentBranch}\n" +
        "  Expected version:  ${expectedVersion}\n" +
        "  gradle.properties: ${minecraft_version}\n" +
        "\n" +
        "This usually happens after switching branches without updating gradle.properties.\n" +
        "Run one of these to fix:\n" +
        "  - git checkout -- gradle.properties          (restore this branch's file)\n" +
        "  - gradle cleanLoomCache && rm -rf .gradle   (full cache reset)\n" +
        "  - Or manually set minecraft_version=${expectedVersion} in gradle.properties"
    )
}

base {
    archivesName = "${archives_base_name}-fabric-${minecraft_version}"
}

version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.shedaniel.me/" }          // cloth-config
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://api.modrinth.com/maven" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation("net.fabricmc.fabric-api:fabric-api:${fabric_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api-base"
    }
    // Cloth Config — installed as separate mod in test instance
    implementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"
    // JEI core is vendored in-tree (src/main/java/mezz/) — no compile-time JEI
    // jar needed.  The two search libraries are JEI Common's only external
    // deps (Maven Central); javax.annotation covers the compile-time
    // @Nonnegative/@ThreadSafe annotations in the 26.2 JEI sources.
    implementation "net.mezzdev:baked-substring-index:0.1.0"
    implementation "net.mezzdev:suffixtree:1.1.0"
    implementation "javax.annotation:javax.annotation-api:1.3.2"
}

tasks.withType(JavaCompile) {
    options.encoding = "UTF-8"
    options.release = 25
}

loom {
    accessWidenerPath = file("src/main/resources/brbe.common.accesswidener")
}

processResources {
    // don't include things we don't need at runtime
    exclude("**/*.ase", "**/*.kra")
}

// ============================================================
//  cleanLoomCache — nuke all local loom / fabric caches
// ============================================================
// Run this when you hit "Namespace mismatch" or other mapping
// corruption after switching branches or updating client jars.
// ============================================================
tasks.register("cleanLoomCache") {
    doLast {
        def loomDirs = [
            "${gradle.gradleUserHomeDir}/caches/fabric-loom",
            "${gradle.gradleUserHomeDir}/caches/architectury-loom",
            "${gradle.gradleUserHomeDir}/caches/loom",
        ]
        loomDirs.each { dir ->
            def f = file(dir)
            if (f.exists()) {
                logger.lifecycle("Deleting {}", f)
                delete f
            }
        }
        logger.lifecycle("Run './gradlew' afterwards to re-download all mappings.")
    }
}
