plugins {
    id "architectury-plugin" version "3.4.+"
    id "dev.architectury.loom" version "1.14.476" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom"

    loom {
        silentMojangMappingsLicense()
    }

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
        // The following line declares the mojmap mappings, you may use other mappings as well
        mappings loom.officialMojangMappings()
        // The following line declares the yarn mappings you may select this one as well.
        // mappings "net.fabricmc:yarn:1.18+build.1:v2"
    }

    jar {
        processResources {
            // don't include things we don't need at runtime
            exclude("**/*.ase", "**/*.kra")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        // Add repositories to retrieve artifacts from in here.
        // You should only use this when depending on other mods because
        // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
        // See https://docs.gradle.org/current/userguide/declaring_repositories.html
        // for more information about repositories.

        maven {
            url = "https://api.modrinth.com/maven"
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 21
    }

    java {
        // withSourcesJar()  -- disabled: do not package source JARs
    }
}

// Ensure JEI library jars are available in libs/ for compilation.
// If a jar is missing locally, copies it from the test instance mods folders.
// Run manually: ./gradlew setupLibs
tasks.register("setupLibs") {
    doLast {
        def libsDir = rootProject.file("libs")
        libsDir.mkdirs()

        def jeiEntries = [
                "jei-1.21.11-fabric-27.4.0.22.jar":
                        "/media/avalonia/data/MinecraftLib/versions/1.21.11-Fabric/mods/jei-1.21.11-fabric-27.4.0.22.jar.disabled",
                "jei-1.21.11-neoforge-27.4.0.22.jar":
                        "/media/avalonia/data/MinecraftLib/versions/1.21.11-NeoForge/mods/jei-1.21.11-neoforge-27.4.0.22.jar.disabled"
        ]

        jeiEntries.each { fileName, sourcePath ->
            def targetFile = new File(libsDir, fileName)
            if (!targetFile.exists()) {
                def sourceFile = new File(sourcePath)
                if (sourceFile.exists()) {
                    logger.lifecycle("Copying {} → libs/", fileName)
                    targetFile.bytes = sourceFile.bytes
                } else {
                    logger.warn("Source not found: {}. {} will be excluded from compilation.", sourcePath, fileName)
                }
            }
        }
    }
}

// Auto-run setupLibs before any compile task
gradle.projectsEvaluated {
    subprojects {
        tasks.matching { it.name == "compileJava" || it.name == "classes" }.configureEach {
            dependsOn rootProject.tasks.named("setupLibs")
        }
    }
}
