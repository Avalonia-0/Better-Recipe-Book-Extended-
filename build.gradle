plugins {
    id "architectury-plugin" version "3.4.+"
    id "dev.architectury.loom-no-remap" version "1.14.475" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"

        // fabric-loader provides Mixin and @Environment at compile time
        compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

        // Common module: compile-only deps (platform modules provide at runtime)
        if (project.name == "common") {
            compileOnly("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
                exclude group: "net.fabricmc.fabric-api"
            }
        }
    }

    jar {
        processResources {
            // don't include things we don't need at runtime
            exclude("**/*.ase", "**/*.kra")
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name
    }
    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        maven { url = "https://maven.fabricmc.net/" }
        maven { url = "https://maven.architectury.dev/" }
        maven { url = "https://maven.neoforged.net/releases" }
        maven { url = "https://api.modrinth.com/maven" }
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = 25
    }

    java {
        withSourcesJar()
    }
}
