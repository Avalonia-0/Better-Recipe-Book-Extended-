plugins {
    id "com.gradleup.shadow" version "9.0.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Mixin annotations (provided by NeoForge at runtime, needed at compile time)
    compileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"

    // Architectury API (local jar)
    implementation("dev.architectury:architectury-neoforge:${rootProject.architectury_version}")

    // Cloth Config (NeoForge version — includes neoforge.mods.toml to suppress warning)
    implementation("me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}")

    def jeiJarPath = rootProject.findProperty("jei_neoforge_jar")
            ?: "/media/avalonia/data/MinecraftLib/versions/26.1.2-NeoForge/mods/jei-26.1.2-neoforge-29.6.2.31.jar"
    if (file(jeiJarPath).exists()) {
        compileOnly files(jeiJarPath)
    }

    // Common module (loom-no-remap does not provide namedElements/transformProduction*)
    common(project(path: ":common")) { transitive false }
    shadowBundle(project(path: ":common")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

jar {
    // For unobfuscated MC 26.1+, the final jar bundles shadowJar directly
    dependsOn shadowJar
    from shadowJar.archiveFile.map { zipTree(it) }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    archiveClassifier = null
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

base {
    archivesName = "BetterRecipeBookExtended-${rootProject.mod_version}-neoforge-${rootProject.minecraft_version}"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
