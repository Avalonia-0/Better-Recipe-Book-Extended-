plugins {
    id "com.gradleup.shadow" version "9.0.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

def jeiNeoForgePresent = false

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Architectury API. This is optional, and you can comment it out if you don"t need it.
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    modApi "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"
    include "me.shedaniel.cloth:cloth-config-neoforge:${rootProject.cloth_config_version}"

    def jeiJarPath = rootProject.findProperty("jei_neoforge_jar")?.toString()
    if (jeiJarPath == null || !file(jeiJarPath).exists()) {
        jeiJarPath = rootProject.file("libs/jei-1.21.11-neoforge-27.4.0.22.jar").absolutePath
    }
    if (jeiJarPath == null || !file(jeiJarPath).exists()) {
        jeiJarPath = rootProject.file("libs/jei-1.21.11-fabric-27.4.0.22.jar").absolutePath
    }
    if (jeiJarPath != null) {
        compileOnly files(jeiJarPath)
    }

    jeiNeoForgePresent = jeiJarPath != null && jeiJarPath.toString().contains("neoforge")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

tasks.named("compileJava") {
    if (!jeiNeoForgePresent) {
        exclude("com/alonie/brbe/neoforge/compat/jei/BetterRecipeBookJEIPlugin.java")
    }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge-${rootProject.minecraft_version}"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
