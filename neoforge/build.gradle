plugins {
    id "com.gradleup.shadow" version "9.0.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

def jeiNeoForgePresent = false

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Architectury API — commented out (no compile-time dependency)
    // modImplementation files("/home/avalonia/Downloads/1.21.1/architectury-13.0.8-neoforge.jar")

    modApi files(rootProject.file("libs/cloth-config-15.0.140-neoforge.jar"))

    def jeiJarCandidates = [
            rootProject.findProperty("jei_neoforge_jar"),
            rootProject.file("libs/jei-1.21.1-neoforge-19.27.0.340.jar").absolutePath
    ].findAll { it != null }
    def jeiJarPath = jeiJarCandidates.find { file(it).exists() }
    if (jeiJarPath != null) {
        compileOnly files(jeiJarPath)
    }

    jeiNeoForgePresent = jeiJarPath != null && jeiJarPath.toString().contains("neoforge")

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

    // Conditional compile: exclude JEI plugin when JEI Neoforge variant is missing.
    // With JEI in libs/ this normally succeeds; this guard prevents a hard crash for CI or fresh clones.
    // TODO: replace with a proper source set or JEI-on-classpath invariant once the build setup is overhauled.
    tasks.named("compileJava") {
        if (!jeiNeoForgePresent) {
            exclude("com/alonie/brbe/neoforge/compat/jei/BetterRecipeBookJEIPlugin.java")
        }
    }

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

// sourcesJar {
//     def commonSources = project(":common").sourcesJar
//     dependsOn commonSources
//     from commonSources.archiveFile.map { zipTree(it) }
// }

base {
    archivesName = "${rootProject.archives_base_name}-neoforge-${rootProject.minecraft_version}"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
