modLoader = "javafml"
loaderVersion = "[2,)"
issueTrackerURL = "https://github.com/mrshmllow/BetterRecipeBook/issues"
license = "MIT"

[[mods]]
modId = "brbe"
version = "${version}"
displayName = "Better Recipe Book (Extended)"
authors = "marshmallow"
credits = "ruvaldak, Felix14-v2, buiawpkgew1, TauCubed, MehradN, notlin4"
