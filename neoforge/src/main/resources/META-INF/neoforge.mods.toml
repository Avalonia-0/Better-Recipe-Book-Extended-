side = "CLIENT"

[[dependencies.brbe]]
modId = "minecraft"
type = "required"
versionRange = "[1.21,)"
ordering = "NONE"
side = "CLIENT"

[[dependencies.brbe]]
modId = "architectury"
type = "required"
versionRange = "[13,)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.brbe]]
modId = "jei"
type = "optional"
versionRange = "[27,)"
ordering = "AFTER"
side = "CLIENT"

[[mixins]]
config = "mixins.brbe.json"

[[mixins]]
config = "mixins.brbe-common.json"

[[mixins]]
config = "mixins.brbe-common-compat.json"

[[mixins]]
config = "mixins.brbe-jei-common.json"

[[mixins]]
config = "mixins.brbe-rei-common.json"

[[dependencies.brbe]]
modId = "recipe_book_is_pain_extended"
type = "required"
versionRange = "[2.0,)"
ordering = "NONE"
