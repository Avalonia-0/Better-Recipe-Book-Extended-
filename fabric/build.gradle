architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Bundled as a jar-in-jar child mod under META-INF/jars/.
    jeiPluginsInJar
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

// The companion JEI-plugin mod lives in its own git worktree
// (../jei-plugins) and is consumed as a built jar file, then bundled whole as a
// fabric-loader nested mod (jar-in-jar).  Build ../jei-plugins first.
def jeiPluginsJar = rootProject.file("../jei-plugins/jei-plugins/build/libs/brbe-ava-jei-plugins-26.2-2.3.jar")

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api-base"
    }
    // implementation("dev.architectury:architectury-fabric:${rootProject.architectury_version}")
    // Cloth Config — installed as separate mod in test instance
    implementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    // ModMenu is distributed with intermediary mappings, which conflicts with
    // loom-no-remap (Mojmap). ModMenuFabric integration is currently disabled.
    // implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    // JEI — compileOnly from libs/
    def jeiJar = rootProject.file("libs/jei-26.2-fabric-30.4.0.25.jar")
    if (jeiJar.exists()) { compileOnly files(jeiJar) }
    implementation(project(path: ":common"))
    jeiPluginsInJar files(jeiPluginsJar)
}

// Include common module (classes + resources) — loom-no-remap doesn't auto-merge
jar {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude "rbip-neoforge.mixins.json"
    // The companion mod is bundled whole as a fabric-loader nested mod.
    from(files(jeiPluginsJar)) {
        into("META-INF/jars")
    }
}

// JEI overlay mixins are compiled now — JEI jar is available via implementation files(jeiJarPath)
