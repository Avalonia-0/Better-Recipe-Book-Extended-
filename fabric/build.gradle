architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}"
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/brbe.common.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api-base"
    }
    modImplementation("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    modCompileOnly files(rootProject.file("libs/modmenu-17.0.0.jar"))

    def jeiJarPath = rootProject.findProperty("jei_fabric_jar")
            ?: "/media/avalonia/data/MinecraftLib/versions/1.21.11-Fabric/mods/jei-1.21.11-fabric-27.4.0.22.jar"
    if (file(jeiJarPath).exists()) {
        modCompileOnly files(jeiJarPath)
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
}

// Include common module (classes + resources)
jar {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
