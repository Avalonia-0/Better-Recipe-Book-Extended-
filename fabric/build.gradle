architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api-base"
    }
    implementation("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    implementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    def jeiJarPath = rootProject.findProperty("jei_fabric_jar")?.toString()
    if (jeiJarPath == null || !file(jeiJarPath).exists()) {
        jeiJarPath = rootProject.file("libs/jei-26.1.2-fabric-29.6.2.31.jar").absolutePath
    }
    if (file(jeiJarPath).exists()) {
        compileOnly files(jeiJarPath)
    }
    implementation(project(path: ":common"))
}

tasks.named("compileJava") {
    exclude("com/alonie/brbe/fabric/compat/jei/BetterRecipeBookJEIPlugin.java")
}

// Include common module (classes + resources) — loom-no-remap doesn't auto-merge
jar {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
