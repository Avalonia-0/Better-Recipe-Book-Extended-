architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}"
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api-base"
    }
    // implementation("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
    //     exclude group: "net.fabricmc.fabric-api"
    // }
    implementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    // ModMenu is distributed with intermediary mappings, which conflicts with
    // loom-no-remap (Mojmap). ModMenuFabric integration is currently disabled.
    // implementation "com.terraformersmc:modmenu:${rootProject.modmenu_version}"
    def jeiJarPath = rootProject.findProperty("jei_fabric_jar")?.toString()
    if (jeiJarPath == null || !file(jeiJarPath).exists()) {
        jeiJarPath = "/media/avalonia/data/MinecraftLib/versions/26.1.2-Fabric/mods/jei-26.1.2-fabric-29.6.2.31.jar"
    }
    // User may have disabled JEI via HMCL (appends .disabled to file name)
    if (!file(jeiJarPath).exists()) {
        jeiJarPath = "/media/avalonia/data/MinecraftLib/versions/26.1.2-Fabric/mods/jei-26.1.2-fabric-29.6.2.31.jar.disabled"
    }
    if (file(jeiJarPath).exists()) {
        implementation files(jeiJarPath)
    }
    implementation(project(path: ":common"))
}

// Include common module (classes + resources) — loom-no-remap doesn't auto-merge
jar {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// JEI overlay mixins are compiled now — JEI jar is available via implementation files(jeiJarPath)
