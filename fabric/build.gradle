architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}"
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/brbe.common.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation files("/home/avalonia/Downloads/1.21.1/fabric-api-0.116.12+1.21.1.jar")
    modImplementation files("/home/avalonia/Downloads/1.21.1/architectury-13.0.8-fabric.jar")
    modImplementation files("/home/avalonia/Downloads/1.21.1/cloth-config-15.0.140-fabric.jar")

    modCompileOnly "com.terraformersmc:modmenu:${rootProject.modmenu_version}"

    def jeiJarPath = rootProject.findProperty("jei_fabric_jar")?.toString()
    if (jeiJarPath == null || !file(jeiJarPath).exists()) {
        jeiJarPath = rootProject.file("libs/jei-1.21.1-fabric-19.27.0.340.jar").absolutePath
    }
    if (file(jeiJarPath).exists()) {
        modCompileOnly files(jeiJarPath)
    }

    def reiJarPath = rootProject.findProperty("rei_fabric_jar")
    if (reiJarPath == null || !file(reiJarPath).exists()) {
        reiJarPath = rootProject.file("libs/jei-1.21.1-fabric-19.27.0.340.jar").absolutePath
    }
    if (file(reiJarPath).exists()) {
        modCompileOnly files(reiJarPath)
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
}

// Exclude JEI compat classes when JEI is not on the classpath
def jeiJarPath = rootProject.findProperty("jei_fabric_jar")?.toString()
if (jeiJarPath == null || !file(jeiJarPath).exists()) {
    jeiJarPath = rootProject.file("libs/jei-1.21.1-fabric-19.27.0.340.jar").absolutePath
}
def jeiPresent = file(jeiJarPath).exists()
tasks.named("compileJava") {
    if (!jeiPresent) {
        exclude("com/alonie/brbe/fabric/compat/jei/**")
        exclude("com/alonie/brbe/fabric/mixin/Jei*")
    }
}

// Include common module (classes + resources)
jar {
    from project(":common").sourceSets.main.output
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
