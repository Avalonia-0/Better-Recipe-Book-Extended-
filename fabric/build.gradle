architectury {
    platformSetupLoomIde()
    fabric()
}

base {
    archivesName = "${rootProject.archives_base_name}-fabric-${rootProject.minecraft_version}"
}

loom {
    accessWidenerPath = project(":common").file("src/main/resources/brbe.common.accesswidener")
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
}

def jeiFabricJarPath = rootProject.findProperty("jei_fabric_jar")?.toString()
if (jeiFabricJarPath == null || !file(jeiFabricJarPath).exists()) {
    jeiFabricJarPath = rootProject.file("libs/jei-1.21.11-fabric-27.4.0.22.jar").absolutePath
}
def jeiFabricPresent = file(jeiFabricJarPath).exists()

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation("net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}") {
        exclude group: "net.fabricmc.fabric-api", module: "fabric-api-base"
    }
    modImplementation("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"

    modCompileOnly files(rootProject.file("libs/modmenu-17.0.0.jar"))

    if (jeiFabricPresent) {
        modCompileOnly files(jeiFabricJarPath)
    }

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
}

tasks.named("compileJava") {
    if (!jeiFabricPresent) {
        exclude("com/alonie/brbe/fabric/compat/jei/BetterRecipeBookJEIPlugin.java")
    }
}

// Merge RBIP classes directly into BRBE JAR (exclude mod metadata)
jar {
    from project(":common").sourceSets.main.output
    from(zipTree(rootProject.file("libs/rbipe-fabric-1.21.11-2.0.jar"))) {
        exclude "fabric.mod.json"
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
