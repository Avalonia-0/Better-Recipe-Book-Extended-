plugins {
    id "com.gradleup.shadow" version "9.0.1"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    // 关键：显式声明 neoForge 平台才会给 dependencies 注册 neoForge(...) 方法
    // （architectury { neoForge() } 单独调用在冷配置下不注册——2026-08-28 定位）。
    neoForge { }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = "NeoForged"
        url = "https://maven.neoforged.net/releases"
    }
}

def jeiNeoForgePresent = false

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    // Architectury API — commented out (no compile-time dependency)
    // modImplementation files("/home/avalonia/Downloads/1.21.1/architectury-13.0.8-neoforge.jar")

    modApi files(rootProject.file("libs/cloth-config-15.0.140-neoforge.jar"))

    // JEI 编译依赖移除：mezz.jei.* 全部来自 common 内嵌 fork（官方 1.21.1
    // 源码），真实 JEI 19.27 jar 的 common 内部类与 fork 版本不一致——混编会
    // 造成平台封装与接口错配。运行时真实 JEI 存在时其类仍按类加载顺序遮蔽 fork。
    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowBundle project(path: ":common", configuration: "transformProductionNeoForge")
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand version: project.version
    }
}

shadowJar {
    exclude "fabric.mod.json"
    exclude "recipe-book-is-pain-extended.mixins.json"
    exclude "brbe.common.accesswidener"
    exclude "mixins.brbe-jei-common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

// sourcesJar {
//     def commonSources = project(":common").sourcesJar
//     dependsOn commonSources
//     from commonSources.archiveFile.map { zipTree(it) }
// }

base {
    archivesName = "${rootProject.archives_base_name}-neoforge-${rootProject.minecraft_version}"
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}

publishing {
    publications {
        mavenNeoForge(MavenPublication) {
            artifactId = rootProject.archives_base_name + "-" + project.name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
    }
}
