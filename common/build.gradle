architectury {
    common("fabric", "neoforge")
}

loom {
    accessWidenerPath = file("src/main/resources/brbe.common.accesswidener")
}

dependencies {
    modCompileOnly "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modCompileOnly("dev.architectury:architectury-fabric:${rootProject.architectury_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    modCompileOnly "me.shedaniel.cloth:cloth-config-fabric:${rootProject.cloth_config_version}"
    modCompileOnly "com.moandjiezana.toml:toml4j:0.7.2"

    // JEI compile-only for JEI overlay mixin (optional compat)
    def jeiJar = rootProject.file("libs/jei-${rootProject.minecraft_version}-fabric-27.4.0.22.jar")
    if (jeiJar.exists()) {
        compileOnly files(jeiJar.absolutePath)
    } else {
        // Fallback: try version-less or any JEI fabric jar in libs
        def fallback = rootProject.file("libs").listFiles()?.find { f ->
            f.name.startsWith("jei-") && f.name.contains("fabric") && f.name.endsWith(".jar")
        }
        if (fallback != null) {
            compileOnly files(fallback.absolutePath)
        }
    }
}
